<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <link rel="manifest" href="/student-manifest.json">
  <link rel="apple-touch-icon" href="/icon/icon-512.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>成員勤務端</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { user-select: none; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-gray-900 text-white h-[100dvh] max-h-[100dvh] p-4 flex flex-col justify-between overflow-hidden">

  <div class="flex-none flex justify-between items-center bg-gray-800 p-4 rounded-xl mb-3 border border-gray-700 shadow-lg">
    <div>
      <span class="text-xs text-gray-400 block">成員</span>
      <input id="studentName" type="text" placeholder="輸入姓名" class="bg-transparent font-bold text-lg text-white border-b border-gray-600 focus:outline-none focus:border-red-500 w-32" onchange="saveName()">
    </div>
    <button id="dutyBtn" onclick="toggleDuty(this)" class="px-5 py-2.5 rounded-lg font-bold text-sm bg-gray-700 text-gray-300">
      Off Duty (離線)
    </button>
  </div>

  <div class="flex-1 flex flex-col min-h-0 justify-center">
    <div id="missionContainer" class="space-y-4 overflow-y-auto max-h-full"></div>
    <div id="standbyBox" class="bg-gray-800/60 border border-gray-700 p-5 rounded-2xl my-auto space-y-3 shadow-xl flex flex-col justify-center">
      <div class="flex items-center justify-center space-x-3">
        <div id="statusDot" class="w-3.5 h-3.5 rounded-full bg-gray-500"></div>
        <span id="standbyTitle" class="text-base font-extrabold text-gray-300">尚未上線</span>
      </div>
      <p id="standbyText" class="text-gray-400 text-xs text-center leading-relaxed">
        請先輸入姓名並切換為 On Duty
      </p>
      <div id="dutyGuideBox" class="hidden pt-2.5 border-t border-gray-700/60 text-left space-y-2 text-[11px] text-gray-300">
        <div class="flex items-center space-x-2 text-yellow-400 font-bold">
          <span>⚡</span>
          <span>即時勤務注意事項</span>
        </div>
        <ul class="list-disc list-inside space-y-1 text-gray-400">
          <li>保持網路連線與手機通知開啟。</li>
          <li>收到急救派遣時，手機將發出推播並即時顯示案件卡片。</li>
          <li>接案後請迅速移動至現場，善用「現場對話」回報狀況。</li>
        </ul>
      </div>
    </div>
  </div>

  <div class="flex-none pt-2">
    <p class="text-center text-[11px] text-gray-500 border-t border-gray-800/80 pt-2">
      校園急救即時派遣系統 • PWA Mobile
    </p>
  </div>

  <div id="customConfirmModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-gray-800 border border-gray-700 rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4">
      <div class="flex items-center space-x-2 text-yellow-400 font-extrabold text-lg">
        <span>⚠️</span>
        <span>校園急救派遣系統</span>
      </div>
      <p id="customConfirmMessage" class="text-gray-200 text-sm leading-relaxed"></p>
      <div class="flex justify-end space-x-3 pt-2">
        <button id="modalConfirmCancelBtn" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-gray-300 font-bold rounded-lg text-sm transition">取消</button>
        <button id="modalConfirmOkBtn" class="px-4 py-2 bg-red-600 hover:bg-red-500 text-white font-bold rounded-lg text-sm transition">確定</button>
      </div>
    </div>
  </div>

  <div id="customAlertModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-gray-800 border border-gray-700 rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4">
      <div class="flex items-center space-x-2 text-yellow-400 font-extrabold text-lg">
        <span>⚠️</span>
        <span>校園急救派遣系統</span>
      </div>
      <p id="customAlertMessage" class="text-gray-200 text-sm leading-relaxed"></p>
      <div class="flex justify-end pt-2">
        <button id="modalAlertOkBtn" class="px-4 py-2 bg-yellow-500 hover:bg-yellow-400 text-gray-900 font-bold rounded-lg text-sm transition">我知道了</button>
      </div>
    </div>
  </div>

  <script>
    let isOnDuty = false;
    let evtSource = null;
    let cachedMissions = [];

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getTimeToMinute() {
      const now = new Date();
      return new Intl.DateTimeFormat('zh-TW', {
        timeZone: 'Asia/Taipei',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).format(now);
    }

    function customConfirm(message) {
      return new Promise((resolve) => {
        const modal = document.getElementById('customConfirmModal');
        const msgEl = document.getElementById('customConfirmMessage');
        const okBtn = document.getElementById('modalConfirmOkBtn');
        const cancelBtn = document.getElementById('modalConfirmCancelBtn');

        msgEl.innerText = message;
        modal.classList.remove('hidden');

        const handleOk = () => { cleanup(); resolve(true); };
        const handleCancel = () => { cleanup(); resolve(false); };
        const cleanup = () => {
          modal.classList.add('hidden');
          okBtn.removeEventListener('click', handleOk);
          cancelBtn.removeEventListener('click', handleCancel);
        };

        okBtn.addEventListener('click', handleOk);
        cancelBtn.addEventListener('click', handleCancel);
      });
    }

    function customAlert(message) {
      return new Promise((resolve) => {
        const modal = document.getElementById('customAlertModal');
        const msgEl = document.getElementById('customAlertMessage');
        const okBtn = document.getElementById('modalAlertOkBtn');

        msgEl.innerText = message;
        modal.classList.remove('hidden');

        const handleOk = () => {
          modal.classList.add('hidden');
          okBtn.removeEventListener('click', handleOk);
          resolve();
        };

        okBtn.addEventListener('click', handleOk);
      });
    }

    function saveName() {
      const name = document.getElementById('studentName').value.trim();
      localStorage.setItem('student_name', name);
    }
    
    setInterval(async () => {
      if (isOnDuty) {
        const name = document.getElementById('studentName').value.trim();
        if (name) {
          try { await reportStatus('On Duty'); } catch (e) {}
        }
      }
    }, 480000); 

    function stopVibration() {
      if (navigator.vibrate) navigator.vibrate(0);
    }

    function updateDutyUI() {
      const btn = document.getElementById('dutyBtn');
      const standbyTitle = document.getElementById('standbyTitle');
      const standbyText = document.getElementById('standbyText');
      const statusDot = document.getElementById('statusDot');
      const dutyGuideBox = document.getElementById('dutyGuideBox');
      const standbyBox = document.getElementById('standbyBox');
      if (standbyBox) standbyBox.classList.remove('hidden');

      if (isOnDuty) {
        btn.className = "px-6 py-3 rounded-lg font-bold text-sm bg-green-600 text-white shadow-lg shadow-green-900/50";
        btn.innerText = "On Duty (待命中)";
        
        statusDot.className = "w-3.5 h-3.5 rounded-full bg-green-400 animate-pulse";
        standbyTitle.className = "text-base font-extrabold text-green-400";
        standbyTitle.innerText = "系統已建立即時連線";
        standbyText.innerText = "您目前處於待命狀態，畫面將即時接收緊急派遣訊息...";
        if (dutyGuideBox) dutyGuideBox.classList.remove('hidden');
      } else {
        btn.className = "px-6 py-3 rounded-lg font-bold text-sm bg-gray-700 text-gray-300";
        btn.innerText = "Off Duty (離線)";
        
        statusDot.className = "w-3.5 h-3.5 rounded-full bg-gray-500";
        standbyTitle.className = "text-base font-extrabold text-gray-300";
        standbyTitle.innerText = "尚未上線";
        standbyText.innerText = "請先輸入姓名並切換為 On Duty";
        if (dutyGuideBox) dutyGuideBox.classList.add('hidden');
      }
    }

    async function forceOffDuty(reasonMessage = null) {
      isOnDuty = false;
      localStorage.setItem('is_on_duty', 'false');
      stopVibration();
      if (evtSource) {
        evtSource.close();
        evtSource = null;
      }
      const container = document.getElementById('missionContainer');
      if (container) container.innerHTML = '';
      updateDutyUI();
      if (reasonMessage) {
        await customAlert(reasonMessage);
      }
    }

    async function toggleDuty(btnEl) {
      const name = document.getElementById('studentName').value.trim();
      if (!name) return await customAlert('請先輸入姓名！');

      if (btnEl) btnEl.disabled = true;

      saveName();
      isOnDuty = !isOnDuty;
      localStorage.setItem('is_on_duty', isOnDuty ? 'true' : 'false');
      updateDutyUI();

      try {
        if (isOnDuty) {
          await reportStatus('On Duty');
          connectSSE();
          setupWebPush().catch(err => console.log('Push skipped:', err));
        } else {
          await reportStatus('Off Duty');
          await forceOffDuty();
        }
      } finally {
        if (btnEl) setTimeout(() => { btnEl.disabled = false; }, 500);
      }
    }

    async function acceptMission(missionId) {
      stopVibration();
      localStorage.setItem(`mission_status_${missionId}`, '已接案');
      renderMissions(cachedMissions);
      await reportStatus('已接案', missionId);
    }

    async function arriveScene(missionId) {
      stopVibration();
      localStorage.setItem(`mission_status_${missionId}`, '已到場');
      renderMissions(cachedMissions);
      await reportStatus('已到場', missionId);
    }

    async function submitReport(missionId) {
      const name = document.getElementById('studentName').value.trim();
      const input = document.getElementById(`report_input_${missionId}`);
      if (!input) return;

      const text = input.value.trim();
      if (!text) return await customAlert('請先輸入訊息內容！');

      input.value = '';

      // ⚡ 樂觀更新：立刻把對話貼在快取畫面上，0 秒延遲！
      const targetMission = cachedMissions.find(m => m.id === Number(missionId));
      if (targetMission) {
        if (!targetMission.chatMessages) targetMission.chatMessages = [];
        targetMission.chatMessages.push({
          sender: name,
          role: 'student',
          text: text,
          time: getTimeToMinute()
        });
        renderMissions(cachedMissions, true); // 強制重繪對話框
      }

      try {
        await reportStatus('現場訊息', missionId, text);
      } catch (e) {
        console.error('Status report failed:', e);
        await customAlert('網路連線異常，訊息發送失敗！');
      }
    }

    async function leaveScene(missionId) {
      if (await customConfirm('確定已完成任務並離開現場？（案件將從您的畫面移除）')) {
        stopVibration();
        localStorage.setItem(`mission_status_${missionId}`, '已離場');
        renderMissions(cachedMissions);
        await reportStatus('已離場', missionId);
      }
    }

    async function rejectMission(missionId) {
      if (await customConfirm('確定要拒絕此案件嗎？')) {
        stopVibration();
        localStorage.setItem(`mission_status_${missionId}`, '已拒絕');
        renderMissions(cachedMissions);
        await reportStatus('已拒絕', missionId);
      }
    }

    async function setupWebPush() {
      const name = document.getElementById('studentName').value.trim();
      if (!name) return;

      if ('serviceWorker' in navigator && 'PushManager' in window) {
        try {
          const reg = await navigator.serviceWorker.register('/sw.js');
          const permission = await Notification.requestPermission();
          
          if (permission === 'granted') {
            const res = await fetch('/api/vapid-public-key');
            const { publicKey } = await res.json();

            const subscription = await reg.pushManager.subscribe({
              userVisibleOnly: true,
              applicationServerKey: urlBase64ToUint8Array(publicKey)
            });

            await fetch('/api/subscribe', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ subscription, name })
            });
          }
        } catch (err) {
          console.log('Push Setup fail:', err);
        }
      }
    }

    async function reportStatus(status, missionId = null, reportText = null) {
      const name = document.getElementById('studentName').value.trim();
      if (!name) return;
      try {
        await fetch('/api/student/status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, status, missionId, reportText })
        });
      } catch (e) {
        console.error('Status report failed:', e);
      }
    }

    function connectSSE() {
      if (evtSource) evtSource.close();

      evtSource = new EventSource('/api/stream');

      evtSource.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);
          const myName = document.getElementById('studentName').value.trim();

          if (data.action === 'REMOVE_STUDENT' && data.removedName === myName) {
            forceOffDuty('派遣端已手動將您的勤務狀態切換為 Off Duty (離線)！');
            return;
          }
          if (data.studentStatus && data.studentStatus[myName]) {
            if (data.studentStatus[myName].status === 'Off Duty' && isOnDuty) {
              forceOffDuty('您的勤務狀態已被更新為 Off Duty。');
              return;
            }
          }

          if (data.activeMissions) {
            cachedMissions = data.activeMissions;
            renderMissions(data.activeMissions);
          }
        } catch (err) {
          console.error('SSE Error:', err);
        }
      };

      evtSource.onerror = () => {
        if (evtSource) {
          evtSource.close();
          setTimeout(connectSSE, 3000);
        }
      };
    }

    function renderMissions(missions, forceRender = false) {
      const container = document.getElementById('missionContainer');
      const standbyBox = document.getElementById('standbyBox');
      const myName = document.getElementById('studentName').value.trim();

      const activeMissions = (missions || []).filter(m => m.status !== '已結案');

      const visibleMissions = activeMissions.filter(m => {
        const myStatus = localStorage.getItem(`mission_status_${m.id}`) || '未回應';
        return myStatus !== '已離場' && myStatus !== '已拒絕';
      });

      if (!isOnDuty || visibleMissions.length === 0) {
        container.innerHTML = '';
        if (standbyBox) standbyBox.classList.remove('hidden');
        updateDutyUI();
        return;
      }

      if (standbyBox) standbyBox.classList.add('hidden');

      // ⚡ 輸入保護：正在 Focus 打字時跳過背景重繪（除非是發送訊息觸發的 forceRender）
      const activeEl = document.activeElement;
      if (!forceRender && activeEl && activeEl.tagName === 'INPUT' && activeEl.id.startsWith('report_input_')) {
        return;
      }

      container.innerHTML = visibleMissions.map(m => {
        const myStatus = localStorage.getItem(`mission_status_${m.id}`) || '未回應';

        const chatHtml = (m.chatMessages || []).map(msg => {
          const isAdmin = msg.role === 'admin';
          const isMe = !isAdmin && msg.sender === myName;
          let bgStyle = 'bg-gray-800 border-gray-600 text-gray-200';
          if (isAdmin) {
            bgStyle = 'bg-purple-950/80 border-purple-500/50 text-purple-200';
          } else if (isMe) {
            bgStyle = 'bg-yellow-950/80 border-yellow-500/50 text-yellow-200';
          }

          const senderName = isAdmin 
            ? '🗣️ 派遣端' 
            : (isMe ? `👤 ${escapeHtml(msg.sender)} (我)` : `👤 ${escapeHtml(msg.sender)}`);

          return `
            <div class="p-2 rounded border text-xs ${bgStyle}">
              <div class="flex justify-between items-center mb-0.5 font-bold">
                <span>${senderName}</span>
                <span class="text-gray-400 font-mono text-[10px]">${msg.time}</span>
              </div>
              <div class="break-all whitespace-pre-wrap leading-relaxed">${escapeHtml(msg.text)}</div>
            </div>
          `;
        }).join('');

        return `
          <div class="bg-red-950/40 border-2 border-red-600/80 rounded-2xl p-5 shadow-2xl space-y-4">
            <div class="flex justify-between items-start">
              <span class="px-3 py-1 bg-red-600 text-white font-extrabold rounded-lg text-xs tracking-wider">${m.type}</span>
              <span class="text-xs text-gray-400 font-mono">${m.createdAt}</span>
            </div>

            <div>
              <h2 class="text-2xl font-black text-yellow-400 tracking-wide">${escapeHtml(m.location)}</h2>
              ${m.detail ? `<p class="text-sm text-gray-200 mt-1 font-medium">${escapeHtml(m.detail)}</p>` : ''}
            </div>

            <div class="pt-2">
              ${myStatus === '未回應' ? `
                <div class="grid grid-cols-2 gap-3">
                  <button onclick="acceptMission(${m.id})" class="py-3 bg-blue-600 hover:bg-blue-500 text-white font-extrabold rounded-xl shadow-lg active:scale-95 transition">
                    接受案件
                  </button>
                  <button onclick="rejectMission(${m.id})" class="py-3 bg-gray-700 hover:bg-gray-600 text-gray-300 font-extrabold rounded-xl active:scale-95 transition">
                    無法前往
                  </button>
                </div>
              ` : ''}

              ${myStatus === '已接案' ? `
                <button onclick="arriveScene(${m.id})" class="w-full py-3.5 bg-yellow-500 hover:bg-yellow-400 text-gray-900 font-black text-lg rounded-xl shadow-lg active:scale-95 transition">
                  已到達現場
                </button>
              ` : ''}

              ${myStatus === '已到場' ? `
                <button onclick="leaveScene(${m.id})" class="w-full py-3 bg-green-600 hover:bg-green-500 text-white font-extrabold rounded-xl shadow-lg active:scale-95 transition">
                  已離場
                </button>
              ` : ''}
            </div>

            <div class="bg-gray-900/90 p-3 rounded-xl border border-gray-700/80 space-y-3">
              <div class="text-xs font-bold text-yellow-400">即時現場對話</div>
              
              <div class="auto-scroll-chat space-y-1.5 max-h-36 overflow-y-auto pr-1">
                ${chatHtml || '<p class="text-xs text-gray-500">暫無對話紀錄</p>'}
              </div>

              <div class="flex space-x-2 pt-1 border-t border-gray-700/50">
                <input id="report_input_${m.id}" type="text" placeholder="回報現場狀況..." onkeydown="if(event.key==='Enter') submitReport(${m.id})" class="flex-1 bg-gray-800 text-white px-3 py-2 rounded-lg text-xs border border-gray-600 focus:outline-none focus:border-yellow-400">
                <button onclick="submitReport(${m.id})" class="px-3 py-2 bg-yellow-500 text-gray-900 font-bold text-xs rounded-lg whitespace-nowrap">發送</button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      document.querySelectorAll('.auto-scroll-chat').forEach(box => {
        box.scrollTop = box.scrollHeight;
      });
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      return Uint8Array.from([...rawData].map((char) => char.charCodeAt(0)));
    }

    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible' && isOnDuty) {
        try {
          await reportStatus('On Duty');
          connectSSE();
        } catch(e) {
          connectSSE();
        }
      }
    });

    setInterval(async () => {
      if (document.visibilityState === 'visible' && isOnDuty) {
        connectSSE();
      }
    }, 10000);

    window.addEventListener('DOMContentLoaded', async () => {
      const savedName = localStorage.getItem('student_name') || '';
      document.getElementById('studentName').value = savedName;
      
      const savedDuty = localStorage.getItem('is_on_duty');
      if (savedDuty === 'true' && savedName) {
        isOnDuty = true;
        updateDutyUI();
        await reportStatus('On Duty');
        connectSSE();
        setupWebPush().catch(err => console.log('Push skipped:', err));
      } else {
        updateDutyUI();
      }
    });
  </script>
</body>
</html>
