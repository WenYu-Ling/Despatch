<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon/icon-512.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>成員勤務端</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { user-select: none; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 flex flex-col justify-between">

  <div>
    <div class="flex justify-between items-center bg-gray-800 p-4 rounded-xl mb-4 border border-gray-700">
      <div>
        <span class="text-xs text-gray-400 block">成員</span>
        <input id="studentName" type="text" placeholder="輸入姓名" class="bg-transparent font-bold text-lg text-white border-b border-gray-600 focus:outline-none focus:border-red-500 w-32" onchange="saveName()">
      </div>
      <button id="dutyBtn" onclick="toggleDuty()" class="px-6 py-3 rounded-lg font-bold text-sm bg-gray-700 text-gray-300">
        Off Duty (離線)
      </button>
    </div>

    <div id="missionContainer" class="space-y-4">
    </div>

    <div id="standbyBox" class="bg-gray-800/50 border border-gray-700 p-8 rounded-2xl text-center my-8">
      <div class="inline-block p-4 rounded-full bg-gray-700/50 mb-3">📡</div>
      <p id="standbyText" class="text-gray-400 text-sm">請先輸入姓名並切換為 On Duty</p>
    </div>
  </div>

  <p class="text-center text-xs text-gray-500 py-2">即時派遣系統 • PWA Mobile</p>

  <!-- 自訂 UI Modal 彈窗區域 -->
  <div id="customConfirmModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-gray-800 border border-gray-700 rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4">
      <div class="flex items-center space-x-2 text-yellow-400 font-extrabold text-lg">
        <span>⚠️</span>
        <span>校園急救派遣系統</span>
      </div>
      <p id="customConfirmMessage" class="text-gray-200 text-sm leading-relaxed"></p>
      <div class="flex justify-end space-x-3 pt-2">
        <button id="modalConfirmCancelBtn" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-gray-300 font-bold rounded-lg text-sm transition">
          取消
        </button>
        <button id="modalConfirmOkBtn" class="px-4 py-2 bg-red-600 hover:bg-red-500 text-white font-bold rounded-lg text-sm transition">
          確定
        </button>
      </div>
    </div>
  </div>

  <div id="customAlertModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-gray-800 border border-gray-700 rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4">
      <div class="flex items-center space-x-2 text-yellow-400 font-extrabold text-lg">
        <span>⚠️</span>
        <span>校園急救派遣系統</span>
      </div>
      <p id="customAlertMessage" class="text-gray-200 text-sm leading-relaxed"></p>
      <div class="flex justify-end pt-2">
        <button id="modalAlertOkBtn" class="px-4 py-2 bg-yellow-500 hover:bg-yellow-400 text-gray-900 font-bold rounded-lg text-sm transition">
          我知道了
        </button>
      </div>
    </div>
  </div>

  <script>
    let isOnDuty = false;
    let evtSource = null;
    let lastUserActionTime = 0;

    function customConfirm(message) {
      return new Promise((resolve) => {
        const modal = document.getElementById('customConfirmModal');
        const msgEl = document.getElementById('customConfirmMessage');
        const okBtn = document.getElementById('modalConfirmOkBtn');
        const cancelBtn = document.getElementById('modalConfirmCancelBtn');

        msgEl.innerText = message;
        modal.classList.remove('hidden');

        const handleOk = () => { cleanup(); resolve(true); };
        const handleCancel = () => { cleanup(); resolve(false); };
        const cleanup = () => {
          modal.classList.add('hidden');
          okBtn.removeEventListener('click', handleOk);
          cancelBtn.removeEventListener('click', handleCancel);
        };

        okBtn.addEventListener('click', handleOk);
        cancelBtn.addEventListener('click', handleCancel);
      });
    }

    function customAlert(message) {
      return new Promise((resolve) => {
        const modal = document.getElementById('customAlertModal');
        const msgEl = document.getElementById('customAlertMessage');
        const okBtn = document.getElementById('modalAlertOkBtn');

        msgEl.innerText = message;
        modal.classList.remove('hidden');

        const handleOk = () => {
          modal.classList.add('hidden');
          okBtn.removeEventListener('click', handleOk);
          resolve();
        };

        okBtn.addEventListener('click', handleOk);
      });
    }

    function saveName() {
      const name = document.getElementById('studentName').value.trim();
      localStorage.setItem('student_name', name);
    }

    function stopVibration() {
      if (navigator.vibrate) navigator.vibrate(0);
    }

    function updateDutyUI() {
      const btn = document.getElementById('dutyBtn');
      const standbyText = document.getElementById('standbyText');

      if (isOnDuty) {
        btn.className = "px-6 py-3 rounded-lg font-bold text-sm bg-green-600 text-white shadow-lg shadow-green-900/50";
        btn.innerText = "On Duty (待命中)";
        standbyText.innerText = "系統已建立即時連線，等待案件派遣中...";
      } else {
        btn.className = "px-6 py-3 rounded-lg font-bold text-sm bg-gray-700 text-gray-300";
        btn.innerText = "Off Duty (離線)";
        standbyText.innerText = "已離線";
      }
    }

    async function forceOffDuty(reasonMessage = null) {
      isOnDuty = false;
      localStorage.setItem('is_on_duty', 'false');
      stopVibration();
      updateDutyUI();
      if (evtSource) {
        evtSource.close();
        evtSource = null;
      }
      const container = document.getElementById('missionContainer');
      const standbyBox = document.getElementById('standbyBox');
      container.innerHTML = '';
      standbyBox.classList.remove('hidden');

      if (reasonMessage) {
        await customAlert(reasonMessage);
      }
    }

    async function toggleDuty() {
  const name = document.getElementById('studentName').value.trim();
  if (!name) return await customAlert('請先輸入姓名！');

  isOnDuty = !isOnDuty;
  lastUserActionTime = Date.now(); // 🆕 記錄點擊時間點
  localStorage.setItem('is_on_duty', isOnDuty ? 'true' : 'false');
  updateDutyUI();

  if (isOnDuty) {
    await setupWebPush();
    await reportStatus('On Duty');
    connectSSE();
  } else {
    await reportStatus('Off Duty');
    await forceOffDuty();
  }
}

    async function acceptMission(missionId) {
      stopVibration();
      localStorage.setItem(`mission_status_${missionId}`, '已接案');
      await reportStatus('已接案', missionId);
    }

    async function arriveScene(missionId) {
      stopVibration();
      localStorage.setItem(`mission_status_${missionId}`, '已到場');
      await reportStatus('已到場', missionId);
    }

    async function submitReport(missionId) {
      const input = document.getElementById(`report_input_${missionId}`);
      if (!input) return;

      const text = input.value.trim();
      if (!text) return await customAlert('請先輸入訊息內容！');

      input.value = '';

      try {
        await reportStatus('現場訊息', missionId, text);
      } catch (e) {
        console.error('Status report failed:', e);
        await customAlert('網路連線異常，訊息發送失敗！');
        input.value = text;
      }
    }

    async function leaveScene(missionId) {
      if (await customConfirm('確定已完成任務並離開現場？（案件將從您的畫面移除）')) {
        stopVibration();
        localStorage.setItem(`mission_status_${missionId}`, '已離場');
        await reportStatus('已離場', missionId);
      }
    }

    async function rejectMission(missionId) {
      if (await customConfirm('確定要拒絕此案件嗎？')) {
        stopVibration();
        localStorage.setItem(`mission_status_${missionId}`, '已拒絕');
        await reportStatus('已拒絕', missionId);
      }
    }

async function setupWebPush() {
      const name = document.getElementById('studentName').value.trim();
      if (!name) return;

      if ('serviceWorker' in navigator && 'PushManager' in window) {
        try {
          const reg = await navigator.serviceWorker.register('/sw.js');
          const permission = await Notification.requestPermission();
          
          if (permission === 'granted') {
            const res = await fetch('/api/vapid-public-key');
            const { publicKey } = await res.json();

            const subscription = await reg.pushManager.subscribe({
              userVisibleOnly: true,
              applicationServerKey: urlBase64ToUint8Array(publicKey)
            });

            await fetch('/api/subscribe', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ subscription, name })
            });
          }
        } catch (err) {
          console.error('Web Push setup failed:', err);
        }
      }
    }

    async function reportStatus(status, missionId = null, reportText = null) {
      const name = document.getElementById('studentName').value.trim();
      if (!name) return;
      try {
        await fetch('/api/student/status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, status, missionId, reportText })
        });
      } catch (e) {
        console.error('Status report failed:', e);
      }
    }

    function connectSSE() {
      if (!isOnDuty) return;

      if (evtSource) {
        evtSource.close();
      }

      evtSource = new EventSource('/api/stream');

      evtSource.onmessage = async (e) => {
        const data = JSON.parse(e.data);
        const myName = document.getElementById('studentName').value.trim();

        if (data.action === 'REMOVE_STUDENT' && data.removedName === myName) {
          await forceOffDuty('您已被派遣端手動切換為離線狀態 (Off Duty)');
          return;
        }

        if (data.studentStatus && isOnDuty && myName && (Date.now() - lastUserActionTime > 3000)) {
        const myServerStatus = data.studentStatus[myName];
        if (!myServerStatus || myServerStatus.status === 'Off Duty') {
        await forceOffDuty('您已被派遣端切換為離線狀態 (Off Duty)');
        return;
        }}
        
        const activeMissions = (data.activeMissions || []).filter(m => {
          if (m.status === '已結案') return false;
          const localStatus = localStorage.getItem(`mission_status_${m.id}`);
          return localStatus !== '已拒絕' && localStatus !== '已離場';
        });

        const container = document.getElementById('missionContainer');
        const standbyBox = document.getElementById('standbyBox');

        if (activeMissions.length > 0 && isOnDuty) {
          standbyBox.classList.add('hidden');
          let hasNewUnaccepted = false;

          container.innerHTML = activeMissions.map(m => {
            const localStatus = localStorage.getItem(`mission_status_${m.id}`);

            const isAccepted = localStatus === '已接案';
            const isArrived = localStatus === '已到場';
            const isJoined = isAccepted || isArrived;

            if (!isJoined) hasNewUnaccepted = true;

            const chatListHtml = (m.chatMessages || []).length > 0
              ? m.chatMessages.map(msg => {
                  const isAdmin = msg.role === 'admin';
                  const isMe = msg.sender === myName;

                  return `
                    <div class="p-2 rounded border text-xs ${
                      isAdmin 
                        ? 'bg-purple-950/80 border-purple-500/50 text-purple-200' 
                        : (isMe ? 'bg-yellow-950/80 border-yellow-500/50 text-yellow-200' : 'bg-gray-800 border-gray-600 text-gray-200')
                    }">
                      <div class="flex justify-between items-center mb-0.5 font-bold">
                        <span>${isAdmin ? '🗣️ ' : '👤 '}${msg.sender}</span>
                        <span class="text-gray-400 font-mono">${msg.time}</span>
                      </div>
                      <div>${msg.text}</div>
                    </div>
                  `;
                }).join('')
              : `<p class="text-xs text-gray-400 text-center py-2">目前尚無現場回報對話</p>`;

            return `
              <div class="bg-red-600 text-white p-6 rounded-2xl shadow-2xl border-4 border-red-400 ${!isJoined ? 'animate-pulse' : ''}">
                <div class="flex justify-between items-start mb-2">
                  <div class="flex items-center space-x-2">
                    <span class="text-xs font-bold tracking-widest bg-red-800 text-red-200 px-2 py-1 rounded">緊急派遣</span>
                    <span class="text-xs font-mono bg-black/40 px-2 py-0.5 rounded text-yellow-300">${m.createdAt}</span>
                  </div>
                  <button onclick="rejectMission(${m.id})" class="text-xs bg-red-900/80 hover:bg-black text-red-200 px-2.5 py-1 rounded-lg border border-red-400/50 font-bold">
                    ✕ 拒絕/退單
                  </button>
                </div>

                <h1 class="text-3xl font-extrabold mb-1">${m.type}</h1>
                <p class="text-xl font-bold text-yellow-300 mb-2">${m.location}</p>
                <p class="text-sm text-red-100 mb-6">${m.detail || '無額外補充資訊'}</p>
                
                ${!isJoined ? `
                  <div>
                    <button onclick="acceptMission(${m.id})" class="w-full py-4 bg-white text-red-600 font-extrabold text-lg rounded-xl shadow-lg active:scale-95 transition">
                      接受案件 (Accept)
                    </button>
                  </div>
                ` : ''}

                ${isJoined ? `
                  <div class="space-y-3">
                    
                    ${isAccepted ? `
                      <button onclick="arriveScene(${m.id})" class="w-full py-3.5 bg-yellow-400 hover:bg-yellow-300 text-gray-900 font-extrabold text-lg rounded-xl shadow transition">
                      我已到達現場
                      </button>
                    ` : `
                      <div class="bg-green-800/80 text-green-200 text-xs font-bold p-2 rounded text-center">
                      您已到達現場
                      </div>
                    `}

                    <div class="bg-gray-900/90 p-3 rounded-xl border border-red-400/60 space-y-2">
                      <div class="text-xs font-bold text-yellow-300 flex justify-between items-center">
                        <span>💬 現場與派遣即時對話頻道</span>
                      </div>

                      <div id="student_chat_box_${m.id}" class="chat-scroll-box space-y-1.5 max-h-48 overflow-y-auto pr-1">
                        ${chatListHtml}
                      </div>

                      <div class="flex space-x-2 pt-1">
                        <input id="report_input_${m.id}" type="text" placeholder="輸入訊息..." onkeydown="if(event.key==='Enter') submitReport(${m.id})" class="flex-1 bg-gray-800 text-white p-2.5 rounded-lg text-sm border border-gray-600 focus:outline-none focus:border-yellow-400">
                        <button onclick="submitReport(${m.id})" class="px-4 py-2.5 bg-yellow-400 hover:bg-yellow-300 text-gray-900 font-extrabold text-sm rounded-lg transition shadow whitespace-nowrap">
                          傳送
                        </button>
                      </div>
                    </div>

                    <div>
                      <button onclick="leaveScene(${m.id})" class="w-full py-2.5 bg-green-600 hover:bg-green-500 text-white font-extrabold text-sm rounded-lg transition shadow">
                      離開現場
                      </button>
                    </div>

                  </div>
                ` : ''}

              </div>
            `;
          }).join('');

          // 🆕 渲染完畫面後，將隊員端的對話框滑軌自動拉至最底部
          document.querySelectorAll('.chat-scroll-box').forEach(box => {
            box.scrollTop = box.scrollHeight;
          });

          if (hasNewUnaccepted && navigator.vibrate) {
            navigator.vibrate([1000, 200, 1000, 200, 500, 100, 500, 100, 500]);
          }
        } else {
          stopVibration();
          container.innerHTML = '';
          standbyBox.classList.remove('hidden');
        }
      };

      evtSource.onerror = () => {
        if (evtSource) {
          evtSource.close();
          if (isOnDuty) setTimeout(connectSSE, 2000);
        }
      };
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && isOnDuty) {
        connectSSE();
        reportStatus('On Duty');
      }
    });

    window.addEventListener('focus', () => {
      if (isOnDuty) {
        connectSSE();
        reportStatus('On Duty');
      }
    });

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      return Uint8Array.from([...rawData].map((char) => char.charCodeAt(0)));
    }

    window.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('studentName').value = localStorage.getItem('student_name') || '';
      
      const savedDuty = localStorage.getItem('is_on_duty');
      if (savedDuty === 'true') {
        isOnDuty = true;
        updateDutyUI();
        await setupWebPush(); 
        await reportStatus('On Duty');
        connectSSE();
      }
    });
  </script>
</body>
</html>`
